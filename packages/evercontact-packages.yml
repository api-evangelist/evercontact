  API page advertises SDKs - "First-party libraries for Node, Python, and Go, with
  full TypeScript types and examples to get you to first call in minutes" - but
  NONE of those libraries could be found in any public package registry, on any
  Evercontact-controlled GitHub organization, or behind any download link on the
  site. The claim is published; the artifact is not. Recorded as an honest zero
  rather than as an inferred package name, and no `SDKs` pointer is wired into
  apis.yml, because wiring one would credit Evercontact with client libraries a
  developer cannot install.
