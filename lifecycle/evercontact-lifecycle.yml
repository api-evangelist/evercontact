x-findings:
- >-
  The published API base URL https://api.evercontact.com does not serve
  Evercontact - DNS points at an AWS ELB presenting a Sony certificate
  (b2b-lb.eu-prod.sonysnacloud.net). TLS fails for conforming clients and the host
  answers 403. Recorded in full in well-known/evercontact-well-known.yml and
  security/evercontact-domain-security.yml. Despite this, the status page reports
  all API components operational.
