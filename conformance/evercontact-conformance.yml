summary: >-
  Evercontact publishes a compliance program across two pages: a Security &
  Compliance page and a versioned DPA & Compliance page (v4.0, last updated June
  2026). Three frameworks are formally claimed - SOC 2 Type II (audited annually),
  Google CASA Tier 2 (assessed), and GDPR (described by Evercontact itself as
  "aligned", not certified). Evercontact states plainly on that page that it "does
  not claim certifications we don't hold". Two further badges appear on the
  homepage only - NIST 800-53 and "HIPAA-ready" - and are NOT repeated or
  substantiated on either compliance page; they are recorded below as unverified
  marketing claims, not as conformance.
standards:
- id: soc2-type2
  conforms: true
  evidence: >-
    Security and DPA pages both state Evercontact is independently audited to SOC 2
    Type II for security, availability, and confidentiality, annually. The SOC 2
    report is offered to prospects under NDA.
  artifact_public: false
- id: google-casa-tier2
  conforms: true
  evidence: >-
    Google Cloud Application Security Assessment (CASA) Tier 2, validating Google
    Workspace data handling and OAuth scope management. Assessment summary offered
    under NDA.
  artifact_public: false
- id: gdpr
  conforms: true
  evidence: >-
    DPA v4.0 documents controller/processor roles, lawful basis, sub-processor
    transparency, data-subject rights, 30-day deletion on termination, and EU data
    residency on Enterprise plans. Evercontact describes GDPR status as "aligned"
    rather than certified. DPO contact published as dpo@evercontact.com.
- id: eu-standard-contractual-clauses
  conforms: true
  evidence: >-
    DPA section 5 states EEA/UK/Swiss transfers to US-based AWS processing are
    covered by the EU Standard Contractual Clauses plus the UK Addendum, with
    supplementary technical measures.
- id: oauth2
  conforms: true
  evidence: >-
    Mailbox access is granted via revocable OAuth consent for Google Workspace and
    Microsoft 365; withdrawal from the provider console stops processing
    immediately.
- id: saml-sso
  conforms: true
  evidence: >-
    Security page and Enterprise page both list SAML single sign-on via Okta, Azure
    AD and Google (Enterprise plans).
- id: scim
  conforms: true
  evidence: >-
    Automated user provisioning/deprovisioning via SCIM through Okta, Azure AD and
    Google (Enterprise plans).
- id: tls13
  conforms: true
  evidence: >-
    TLS 1.3 in transit claimed on the security page; live probe of
    www.evercontact.com confirmed TLSv1.3. NOTE the probe also found HSTS is NOT
    served on www.evercontact.com despite the security page claiming "HSTS
    enforced", and that the published API host api.evercontact.com does not present
    a valid certificate at all - see security/evercontact-domain-security.yml.
- id: hsts
  conforms: false
  evidence: >-
    Claimed on https://www.evercontact.com/security.html ("TLS 1.3 everywhere, HSTS
    enforced"), but no Strict-Transport-Security header was observed on
    www.evercontact.com on 2026-08-14.
- id: nist-800-53
  conforms: unverified
  evidence: >-
    Appears as a badge in the homepage privacy panel only. Not listed in the
    frameworks table on the DPA & Compliance page and not substantiated anywhere
    else on the site. Recorded as a claim, not as conformance.
- id: hipaa
  conforms: unverified
  evidence: >-
    Homepage badge reads "HIPAA-ready", which is not a certification and is not
    repeated on the compliance pages. Recorded as a claim, not as conformance.
- id: rfc9457-problem-details
  conforms: false
  evidence: No application/problem+json error contract published.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No deprecation policy or Sunset/Deprecation header support published.
- id: rfc9116-security-txt
  conforms: false
  evidence: >-
    /.well-known/security.txt returns 404 on every Evercontact host (probed
    2026-08-14).
- id: openapi
  conforms: false
  evidence: >-
    No OpenAPI/Swagger document is served on any Evercontact host. Contract
    discovery probed the docs host, the apex, the app host and the published API
    host root - see well-known/evercontact-well-known.yml.
encryption:
  in_transit: TLS 1.3
  at_rest: AES-256
identity:
  sso: SAML (Okta, Azure AD, Google)
  provisioning: SCIM
  availability: Enterprise plans
sla:
  uptime_target: '99.99%'
  contractual: Enterprise plans
  status_page: https://status.evercontact.com
sub_processors:
  published: true
  url: https://www.evercontact.com/dpa-compliance.html
  advance_notice_of_change: true
  list:
  - {name: Amazon Web Services, purpose: Cloud hosting & storage, region: United States}
  - {name: Qoddi App Platform, purpose: Cloud hosting & storage, region: United States}
  - {name: Google / Microsoft, purpose: Mailbox API access (OAuth), region: Global}
  - {name: SparkPost (MessageBird), purpose: Transactional & contact-form email, region: United States}
data_commitments:
- No model training on customer email
- No data resale / no data-broker business
- Per-tenant logical isolation, least-privilege access
- Immutable exportable audit logs, configurable 7-year retention
- Inbound email signatures only - never message bodies, outbound mail, or private conversation content
- Deletion or return of personal data within 30 days of termination
documentation_on_request:
  available: [SOC 2 report, Google CASA assessment summary, signed DPA, standard contractual clauses]
  conditions: under NDA, via the security team
  url: https://www.evercontact.com/contact.html#security
