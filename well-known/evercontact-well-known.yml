api_host_finding:
  severity: high
  host: api.evercontact.com
  published_as: 'apis[].baseURL and the curl example on https://www.evercontact.com/api.html'
  dns:
    a_records: [98.91.145.143, 18.214.172.114]
  tls:
    handshake_verifies: false
    certificate_subject_cn: b2b-lb.eu-prod.sonysnacloud.net
    certificate_issuer: 'C=US, O=Amazon, CN=Amazon RSA 2048 M01'
    subject_alternative_names: [b2b-lb.eu-prod.sonysnacloud.net]
    not_before: '2025-10-30'
    not_after: '2026-11-28'
  http:
    with_tls_verification: connection refused by the client - hostname mismatch
    with_verification_disabled: 403 on every path
    plain_http: 404
    server_header: awselb/2.0
  reading: >-
    The DNS record for api.evercontact.com points at an AWS Elastic Load Balancer
    whose only certificate name is b2b-lb.eu-prod.sonysnacloud.net - a Sony
    property, not an Evercontact one. No standards-compliant HTTP client can
    complete a TLS handshake with the base URL Evercontact publishes for its API,
    and forcing past the certificate returns 403 from an ELB that is answering for
    someone else. This reads as a stale/dangling DNS record left pointing at
    recycled AWS infrastructure. It is recorded as a probe result, not as a claim
    about intent.
  consequence: >-
    The documented REST API cannot be reached at its published base URL by any
    client, authenticated or not. Every downstream probe in this pass - OpenAPI
    discovery, /.well-known/, MCP tools/list, agent card, rate-limit headers -
    was blocked by this one wall.
  checked: '2026-08-14'

pointer_decision:
  well_known: not-wired
  security_txt: not-wired
  reason: >-
    No path on any host returned a 200 carrying a real discovery document. Per the
    pipeline contract the WellKnown/SecurityTxt pointers assert that the PROVIDER
    serves that surface, so none is emitted.
