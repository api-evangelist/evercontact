x-enrichment:
  date: '2026-08-14'
  status: enriched
  artifacts_added: 4
  pass: local-v1
  note: >-
    Plans, rate limits, packages and data model added from the provider's own pages;
    contract discovery came up empty on every host. Key finding: the published API
    base URL https://api.evercontact.com does not serve Evercontact - DNS points at
    an AWS load balancer presenting a certificate for b2b-lb.eu-prod.sonysnacloud.net,
    TLS fails for conforming clients and the host returns 403. API access itself is
    sales-gated and the advertised Node/Python/Go SDKs exist in no public registry.
