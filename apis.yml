    REST API that extracts structured contact data from email signature text
    (parse), completes a known contact with verified details (enrich), retrieves
    canonical deduplicated person records, registers webhook subscriptions, and
    streams paginated relationship-change events. Bearer-token authenticated,
    versioned under /v1, idempotent writes.
