aid: evercontact
name: Evercontact
description: >-
  Evercontact is an AI-powered contact intelligence platform that automatically
  extracts, enriches, and syncs contact data from email signatures across Google
  Workspace and Microsoft 365. A multilingual model parses names, titles, phone
  numbers, and postal addresses from the signature block of every email in 30+
  languages, deduplicates and enriches the resulting person records, and
  continuously syndicates clean contacts to CRMs (Salesforce, HubSpot, Pipedrive,
  Zoho, Microsoft Dynamics, Attio) and address books. Evercontact also exposes a
  REST API (parse, enrich, contacts, webhooks, events) and a webhook event stream
  for custom integrations, with SOC 2 Type II, Google CASA Tier 2, and GDPR
  compliance.
