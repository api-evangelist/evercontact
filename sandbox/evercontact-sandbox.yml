summary: >-
  Evercontact mentions a sandbox but does not publish one. The API page ends in a
  contact form whose copy is "Tell us what you're building and we'll set you up
  with API keys, docs, and a sandbox to test against" - i.e. sandbox access, and
  the reference itself, are issued through a sales conversation. There is no
  self-serve test environment, no test host, no published test credentials, no
  magic test values and no fixture tooling anywhere on the public site. The only
  self-serve trial is on the end-user product, not the API.
